<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://simple-bbs.y-miki.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <meta name="referrer" content="no-referrer">
    <title>Simple BBS - 匿名掲示板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main>
            <!-- Post form -->
            <section class="post-form">
                <form id="commentForm">
                    <div class="form-row">
                        <input 
                            type="text"
                            id="messageInput" 
                            placeholder="メッセージを入力してください（最大100文字）"
                            maxlength="100"
                            required
                        />
                        <button type="submit" id="submitBtn">投稿</button>
                    </div>
                    <div class="char-count">
                        <span id="charCount">0/100</span>
                    </div>
                </form>
                <div class="info-text">
                    <p>投稿は1分に1回までです</p>
                    <p>100件を超えたコメントは古いものから削除されます</p>
                </div>
                <div id="message" class="message"></div>
            </section>

            <!-- Comments list -->
            <section class="comments-section">
                <div id="loading" class="loading">読み込み中...</div>
                <div id="commentsList" class="comments-list"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
