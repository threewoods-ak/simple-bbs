<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple BBS - シンプル掲示板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Simple BBS</h1>
      <p class="subtitle">匿名でコメントできる掲示板</p>
    </header>

    <main>
      <section class="post-form">
        <h2>コメントを投稿</h2>
        <form id="commentForm">
          <textarea 
            id="messageInput" 
            placeholder="コメントを入力してください（最大100文字）" 
            maxlength="100"
            required
          ></textarea>
          <div class="form-footer">
            <span class="char-count"><span id="charCount">0</span>/100</span>
            <button type="submit" id="submitBtn">投稿する</button>
          </div>
        </form>
        <div id="messageArea" class="message-area"></div>
      </section>

      <section class="comments-section">
        <h2>コメント一覧</h2>
        <div id="commentsList" class="comments-list">
          <div class="loading">読み込み中...</div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 Simple BBS</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
