<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://simple-bbs.y-miki.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <meta name="referrer" content="no-referrer">
    <title>Simple BBS - 匿名掲示板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Simple BBS</h1>
            <p class="subtitle">匿名掲示板</p>
        </header>

        <main>
            <!-- Post form -->
            <section class="post-form">
                <h2>投稿する</h2>
                <form id="commentForm">
                    <textarea 
                        id="messageInput" 
                        placeholder="メッセージを入力してください（最大100文字）"
                        maxlength="100"
                        rows="4"
                        required
                    ></textarea>
                    <div class="form-footer">
                        <span id="charCount">0/100</span>
                        <button type="submit" id="submitBtn">投稿</button>
                    </div>
                </form>
                <div id="message" class="message"></div>
            </section>

            <!-- Comments list -->
            <section class="comments-section">
                <h2>コメント一覧</h2>
                <div id="loading" class="loading">読み込み中...</div>
                <div id="commentsList" class="comments-list"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Simple BBS. Built with Cloudflare Workers.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
