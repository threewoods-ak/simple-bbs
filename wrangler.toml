name = "simple-bbs-copilot"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "simple-bbs-copilot-db"
database_id = "e1dbe905-5561-4bbc-9a0a-b0337f2c0bd5"

# KV Namespaces
[[kv_namespaces]]
binding = "CACHE_KV"
id = "f9779ca797c940049be7c39c55de5bab"
preview_id = "f9779ca797c940049be7c39c55de5bab"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "07cb367ea9fe483b9f505b6e602c13fe"
preview_id = "07cb367ea9fe483b9f505b6e602c13fe"

# Secrets (set via: wrangler secret put GEMINI_API_KEY)
# GEMINI_API_KEY

# Cron Triggers for weekly cleanup (every Sunday at 00:00 UTC)
[triggers]
crons = ["0 0 * * SUN"]

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1