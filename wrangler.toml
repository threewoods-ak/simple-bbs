name = "simple-bbs"
main = "src/index.js"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "simple-bbs-db"
database_id = "0be0ec8e-caeb-461c-96f7-048487d35f0f"

# KV Namespaces
[[kv_namespaces]]
binding = "CACHE_KV"
id = "c84f0ab1f73a41fa869aed3b0e1fc2ca"

[[kv_namespaces]]
binding = "LIMIT_KV"
id = "f108da9daca34c1ca3467eb0d978e433"

# Cron Triggers
[triggers]
crons = ["0 0 * * SUN"]

# Environment variables
[vars]
GEMINI_MODEL = "gemini-2.5-flash"
