name = "simple-bbs-antigravity"
compatibility_date = "2024-04-01"
main = "src/index.js"
assets = { directory = "./public", binding = "ASSETS" }
# pages_build_output_dir = "./public"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "simple-bbs-antigravity-db"
database_id = "ccb68d03-afba-41a4-8347-00cf9d58fbd5"

[[kv_namespaces]]
binding = "KV"
id = "07aa01f6cc1b40a6b06022ac3f797df6"
preview_id = "07aa01f6cc1b40a6b06022ac3f797df6"

[vars]
# GEMINI_API_KEY will be set via secrets or .dev.vars
# GEMINI_MODEL = "gemini-pro" # Optional, defaults to gemini-pro if not set

[triggers]
crons = ["0 0 * * SUN"] # Every Sunday at midnight

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
